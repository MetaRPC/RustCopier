site_name: MetaRPC · Rust Copier
site_description: Practical Rust trade copier guides, authentication, sizing, logs and recovery.
site_url: https://metarpc.github.io/RustCopier/
repo_url: https://github.com/MetaRPC/RustCopier
repo_name: MetaRPC/RustCopier
edit_uri: edit/main/docs/
theme:
  name: material
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
extra_css:
  - styles/custom.css
nav:
  - Overview: index.md
  - Get started:
      - First request: quickstart.md
      - Authentication: authentication.md
      - Copier lifecycle: lifecycle.md
      - Lifecycle recipes: recipes.md
  - Build:
      - API reference: reference.md
      - cTrader and TradeLocker: providers.md
      - Position sizing: sizing.md
      - Trade logs: logs.md
  - Operate:
      - Troubleshooting: troubleshooting.md
      - Testing and contributing: testing.md
  - All SDKs: sdks.md

exclude_docs: |
  README.md

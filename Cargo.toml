[package]
name = "rustcopier"
version = "1.0.0"
edition = "2021"
description = "Official Rust SDK for MetaRPC Trade Copier via gRPC"
license = "MIT"

[dependencies]
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[build-dependencies]
tonic-build = "0.12"


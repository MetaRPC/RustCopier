[package]
name = "rustcopier"
version = "1.0.0"
edition = "2021"
description = "Official Rust SDK for MetaRPC Trade Copier via gRPC"
license = "MIT"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
